<script>
// 방문 집계(GoatCounter, 너머와 같은 계정). 쿠키·개인정보 없음. 앞에 '너머'를 붙여 홈페이지와 섞이지 않게.
window.goatcounter={path:function(p){return '너머'+p}};
(function(){ var q=[],once={},t;
  window.__ev=function(n,o){ if(o){ if(once[n]) return; once[n]=1; }
    var go=function(){ window.goatcounter.count({path:'너머/이벤트/'+n,title:n,event:true}); };
    if(window.goatcounter&&window.goatcounter.count) go(); else q.push(go); };
  t=setInterval(function(){ if(window.goatcounter&&window.goatcounter.count){ clearInterval(t); q.splice(0).forEach(function(f){f();}); } },1000);
  setTimeout(function(){ clearInterval(t); },30000); })();
</script>

// 내 카드 묶음(성운 카드 + 조커)
function pool(){ return [...owned()].map(k=>OUR[k]).concat(jokers()); }
// 조커 만들기: 책미사 170권 밖에서 읽은 책 → 원래의 [읽었어요]로 별을 띄우고 조커가 된다
function jokerForm(){
  selBar(`<div class="bt" style="min-width:240px"><b>조커 만들기</b> · 책미사 밖에서 읽은 책 이름을 적어 주세요.
    <form class="jform" id="jf"><input id="jin" autocomplete="off" placeholder="예: 데미안"><button type="submit" class="go">읽었어요 · 조커 받기</button></form><small id="jmsg"></small></div><button type="button" data-a="x">✕</button>`);
  barIn.querySelector('[data-a="x"]').onclick=()=>selBar();
  const i=document.getElementById('jin'); i.focus();
  document.getElementById('jf').onsubmit=ev=>{ ev.preventDefault(); const v=i.value.trim(), m=document.getElementById('jmsg'); if(!v) return;
    const n=OUR.findIndex(b=>norm(b.t)===norm(v));
    if(n>=0){ m.textContent=`「${OUR[n].t}」는 책미사 170권에 있는 책이라 조커가 아니라 성운 카드예요. 빈칸에서 [읽었어요]를 눌러 주세요.`; return; }
    if(jokers().some(j=>norm(j.t)===norm(v))){ m.textContent='이미 가진 조커예요.'; return; }
    const q=document.getElementById('q'); q.value=v; document.getElementById('bRead').click(); if(window.__ev) __ev('카드/조커 만듦');
    setTimeout(()=>{ SEEN=true; albumView(); selBar(`<div class="bt">새 조커 · <b>${esc(v)}</b> 카드가 카드첩에 들어왔어요. 패에 넣으면 빈자리를 채웁니다.</div><button type="button" data-a="x">확인</button>`); barIn.querySelector('[data-a="x"]').onclick=()=>selBar(); },500); };
}
// ③ 세 장: 섞어서 뽑으면 엎어 둔 채로, 직접 고르면 바로 열린 채로
function dealFrom(cards,openNow){ bar.hidden=true; H=cards.map(b=>({b,open:openNow})); CQi=null; draw(true); if(window.__ev) __ev(openNow?'카드/직접 고름':'카드/섞어 뽑음'); }
function hand(all){ all=all||H.map(h=>h.b);
  const cs=all.filter(b=>!b.joker), J=all.length-cs.length;
  const qs=cs.map(b=>qOf(b)[0]), cnt={}; qs.forEach(q=>cnt[q]=(cnt[q]||0)+1);
  const top=(cs.length?Math.max(...Object.values(cnt)):0)+J;
  const sh0=CQ.map((_,i)=>cs.filter(b=>qOf(b).includes(i)).length).reduce((m,v,i)=>v>m.v?{v,i}:m,{v:0,i:qs[0]||0}), sh={v:sh0.v+J,i:sh0.i};
  const lands=cs.filter(b=>b.k==='land').length, laws=cs.length-lands;
  let name,desc,center;
  if(!cs.length){ name='조커 셋'; center=0; desc='세 장 모두 책미사 밖에서 온 책입니다. 성운도 물음도 이야기꾼이 새로 정합니다.'; }
  else if(top>=3&&J&&new Set(qs).size===1){ name='한 물음을 깊이'; center=qs[0]; desc=`「${CQ[center]}」를 묻는 카드에 조커가 붙어, 한 물음을 끝까지 파고드는 세계가 됩니다.`; }
  else if(top>=3&&!J){ name='한 물음을 깊이'; center=qs[0]; desc=`세 장 모두 「${CQ[center]}」를 묻습니다. 한 물음을 끝까지 파고드는 세계가 됩니다.`; }
  else if(sh.v>=2){ name='이어진 별'; center=sh0.v?sh0.i:qs[0]; desc=`두 장이 「${CQ[center]}」로 이어져 있고, 한 장이 그 사이에 끼어듭니다.`; }
  else { name='세 갈래 길'; center=qs[0]; desc='세 장이 모두 다른 물음을 들고 왔습니다. 멀리 떨어진 별들이 한 땅에서 만납니다.'; }
  const kind=J?`땅 ${lands} · 법칙 ${laws} · 조커 ${J} — 조커는 이야기꾼이 땅이나 법칙으로 앉힙니다`:lands===3?'땅 셋 — 법칙 없이 주민들의 이야기만 있는 세계':lands===0?'법칙 셋 — 이야기꾼이 땅부터 지어 냅니다':`땅 ${lands} · 법칙 ${3-lands}`;
  if(J&&cs.length&&!desc.includes('조커')) desc+=' 조커가 빈자리를 채웁니다.';
  return {name,desc,center,kind};
}
function draw(shuf){
  const all=H.every(h=>h.open), mine=pool();
  box.innerHTML=top(`<button type="button" class="lnk" data-a="album">← 카드첩으로</button>`)+`
   <h3>${all?'세 장이 모였습니다':'카드를 눌러 뒤집어 보세요'}</h3>
   <p class="clead">${all?'마음에 안 드는 카드는 내 카드에서 한 장씩 다시 뽑을 수 있어요.':'모두 당신이 가진 카드입니다. 뒷면 무늬는 그 책이 붙든 물음입니다.'}</p>
   <div class="crow">${H.map((h,i)=>`<div class="cslot"><button type="button" class="card${h.open?' open':''}${shuf&&!h.open?' shuf':''}" data-i="${i}" aria-label="${h.open?esc(h.b.t):'엎어 둔 카드: '+CQ[qOf(h.b)[0]]}"><div class="inner">${backHTML(h.b)}${frontHTML(h.b)}</div></button><button type="button" class="redraw" data-r="${i}" ${h.open&&mine.length>3?'':'disabled'}>다시 뽑기</button></div>`).join('')}</div>
   <div class="chand" ${all?'':'hidden'}></div>
   <div class="cacts" style="margin-top:18px">${all?'':'<button type="button" data-a="all">한꺼번에 뒤집기</button>'}<button type="button" data-a="again">다시 섞기</button></div>
   <div class="cmsg" id="cmsg"></div>`;
  bindTop();
  box.querySelector('[data-a="again"]').onclick=()=>dealFrom(pool().sort(()=>Math.random()-.5).slice(0,3),false);
  const ab=box.querySelector('[data-a="all"]'); if(ab) ab.onclick=()=>{ H.forEach(h=>h.open=true); box.querySelectorAll('.card').forEach(c=>c.classList.add('open')); setTimeout(()=>draw(false),720); };
  box.querySelectorAll('.card').forEach(el=>el.onclick=()=>{ const h=H[+el.dataset.i]; if(h.open) return; h.open=true; el.classList.remove('shuf'); el.classList.add('open'); if(window.__ev) __ev('카드/뒤집음',1); if(H.every(x=>x.open)) setTimeout(()=>draw(false),720); else { const r=el.parentNode.querySelector('.redraw'); if(r&&mine.length>3) r.disabled=false; } });
  box.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{ const i=+el.dataset.r, used=new Set(H.map(h=>idOf(h.b))); const rest=mine.filter(b=>!used.has(idOf(b))); if(!rest.length) return; H[i]={b:rest[Math.floor(Math.random()*rest.length)],open:false}; CQi=null; draw(false); });
  if(all) showHand();
}
function showHand(){
  const p=hand(); if(CQi===null) CQi=p.center;
  const nj=H.filter(h=>!h.b.joker), opts=nj.length?[...new Set(nj.flatMap(h=>qOf(h.b)))]:CQ.map((_,i)=>i);
  const el=box.querySelector('.chand');
  el.innerHTML=`<div class="hn">${p.name}</div><div class="hd">${p.desc}<br>${p.kind}</div>
    <div class="cq">중심 물음 ${opts.map(q=>`<button type="button" data-q="${q}" aria-pressed="${q===CQi}">${CQ[q]}</button>`).join('')}</div>`;
  el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ CQi=+b.dataset.q; showHand(); });
  const acts=box.querySelector('.cacts'); if(!acts.querySelector('[data-a="wake"]')){ acts.insertAdjacentHTML('afterbegin','<button type="button" class="go" data-a="wake">이 세 장으로 세계 깨우기</button>'); acts.querySelector('[data-a="wake"]').onclick=()=>wakeCards(false); }
}

async function wakeCards(force){ const msg=document.getElementById('cmsg');
  if(typeof SAMPLE==='undefined'||!SAMPLE){ msg.innerHTML='<b style="color:var(--gold)">이 세 장으로 세계를 써 줄 이야기꾼은 곧 열립니다.</b><br>그때까지 카드를 모으고 패를 짜 두세요. 읽은 책은 빈칸을 눌러 [읽었어요], 책미사 밖의 책은 조커로.'; if(window.__ev) __ev('카드/깨우기 눌렀으나 이야기꾼 없음'); return; }
  if(!force&&WORLD&&!WORLD.example){
    msg.innerHTML=`<div style="margin:6px auto;max-width:520px;padding:10px 12px;border:1px solid rgba(240,198,116,.5);border-radius:9px">지금 세계 「${esc(WORLD.name)}」가 있어요. 견본은 세계를 하나만 두므로, 이 세 장으로 새로 깨우면 지금 세계는 사라집니다.
      <div class="acts" style="margin-top:8px;justify-content:center"><button data-a="keep">그대로 두기</button><button class="go" data-a="replace">새로 깨우기</button></div></div>`;
    msg.querySelector('[data-a="keep"]').onclick=()=>{ msg.innerHTML=''; };
    msg.querySelector('[data-a="replace"]').onclick=()=>wakeCards(true); return; }
  const p=hand(), Qn=CQ[CQi], qi=(window.QDATA&&QDATA.Q.find(x=>x.q===Qn))||{s:''};
  const bk=H.map(h=>({t:h.b.t,a:h.b.a,y:h.b.y,ours:true})), lines=H.map(h=>h.b.joker?`- ${h.b.t}${h.b.a?' / '+h.b.a:''} (조커 카드: 책미사 170권 밖에서 독자가 읽은 책. 소설·시·희곡이면 땅과 주민, 아니면 법칙으로 앉히고, 이 물음과 이어지는 자리를 이야기꾼이 정한다. 책을 잘 모르면 제목의 인상으로 하나만)`:`- ${h.b.t} (${h.b.k==='land'?'땅':'법칙'} 카드): ${h.b.s||''}`).join('\n');
  close(); busy=true; ctl=new AbortController();
  waiting(`세 장의 카드가 「${Qn}」 아래로 내려앉고 있습니다`, bk.map(b=>b.t).join(' · '));
  const prompt=`${RULES}

이 세계의 중심 물음: 「${Qn}」${qi.s?' — '+qi.s:''}
독자${WHO?`(책미사 회원 ${WHO})`:''}가 자기가 읽은 책으로 모은 카드에서 이 세 장을 꺼냈다. 패 이름은 「${p.name}」(${p.desc}).
서로 상관없어 보이는 책일수록, 이 물음 아래에서 셋이 왜 한 세계에 모였는지를 이야기가 스스로 찾아낸다. 억지로 맞추지 말고, 어긋남 자체를 이 세계의 사건으로 쓴다.

여덟 진영(질문): ${CAMPS.join(", ")}
넨 계열(읽는 힘): ${NEN}

꺼낸 카드(책):
${lines}
${JSON.stringify(books(bk),null,0)}

할 일:
1. 세계 이름 하나(짧게, 이 물음이 깃든 풍경).
2. lands, folk, laws. 책마다 적어도 하나. 땅 카드는 땅과 주민, 법칙 카드는 법칙이 된다. desc는 한두 문장, 그 책이 이 물음에 내놓는 답이 묻어나게.
3. camp: "${Qn}"(정확히 이것), campWhy 한 문장: 세 권이 이 물음에 어떻게 다르게 답하는지.
4. nen: 위 여섯 계열 중 하나(이름만), nenWhy 한 문장.
5. scene: 제1장. 세 책에서 온 것들이 이 땅에서 처음 마주쳐, 중심 물음을 두고 엇갈리다가 하나의 사건이 일어나는 장면. 500~700자, 과거형, 대사 포함, 문단은 줄바꿈으로.
6. ${ASKRULE} 이번에는 중심 물음을 그 주민의 말투로 바꿔 묻는다.
7. next: 이 물음에 또 다르게 답할 실제로 있는 책 한 권(title, author, why 한 문장).

JSON 하나만 답한다:
{"name":"","lands":[{"book":"","name":"","desc":""}],"folk":[{"book":"","name":"","desc":""}],"laws":[{"book":"","law":""}],"camp":"","campWhy":"","nen":"","nenWhy":"","scene":"","ask":{"who":"","q":""},"next":{"title":"","author":"","why":""}}`;
  try{ const r=await SAMPLE.json(prompt,{signal:ctl.signal});
    if(!r||typeof r!=='object') throw {code:'empty'};
    WORLD={created:new Date().toISOString().slice(0,10),question:Qn,hand:p.name,cards:true,who:WHO||'',books:bk.map(b=>b.t),name:String(r.name||"이름 없는 세계"),lands:arr(r.lands),folk:arr(r.folk),laws:arr(r.laws),
      camp:String(r.camp||Qn),campWhy:String(r.campWhy||""),nen:String(r.nen||""),nenWhy:String(r.nenWhy||""),
      chapters:[{t:"제1장 · 깨어남",x:String(r.scene||"")}],stones:[],ask:r.ask||null,next:r.next||null};
    saveW(); refreshWake(); render(WORLD); if(window.__ev) __ev('카드/세계 깨움');
  }catch(e){ const m=errCopy(e)||(e&&e.code==='cancelled'?'':'세계를 쓰다가 멈췄어요. 잠시 뒤 다시 눌러 주세요.'+(e&&(e.code||e.message)?` (${esc(String(e.code||e.message))})`:'')); if(m){ wrap.innerHTML=`<div class="wait"><p class="err">${m}</p><div class="acts" style="justify-content:center"><button id="cBack">돌아가기</button></div></div>`; const b=document.getElementById('cBack'); if(b) b.onclick=closeWorld; } else closeWorld(); }
  finally{ busy=false; } }

function open(){ card.hidden=true; X.hidden=false; document.body.classList.add('cxo'); SEEN=false; BSEEN=false; try{ stopJourney(); }catch(e){} X.scrollTop=0; SEL=[]; if(WHO===null) whoView(); else albumView(); if(window.__ev) __ev('카드/시작',1); }
function close(){ if(window.BINDER) return; X.hidden=true; bar.hidden=true; document.body.classList.remove('cxo'); try{ card.hidden=true; }catch(e){} }
window.openCards=open;
addEventListener('keydown',e=>{ if(!X.hidden&&e.key==='Escape'){ close(); e.stopImmediatePropagation(); } },true);
{ const sub=document.querySelector('#me .sub'); const b=document.createElement('button'); b.id='cBtn'; b.type='button'; b.textContent='🂠 내 카드';
  b.style.cssText='color:var(--gold);border-color:rgba(240,198,116,.55)'; b.onclick=open;
  const q=document.getElementById('qBtn'); if(q) q.insertAdjacentElement('beforebegin',b); else sub.prepend(b); }
})();

</script>
<script>
// 책미사 바인더가 열릴 때: 곧장 카드첩, 새 카드가 들어왔으면 반짝, 홈 화면에 두기 안내(한 번 닫으면 다시 안 띄움)
(function(){
const sget=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const sset=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const APP=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(window.__ev){ __ev('바인더/열림',1); if(APP) __ev('바인더/홈 화면에서 엶',1); }
// 너머에서 넘어옴(11/21): ?who=닉네임 → 그 카드첩으로, ?inst=1(PC QR) → 설치 안내를 닫았어도 다시
const QS=new URLSearchParams(location.search), INST=QS.get('inst')==='1';
if(INST&&window.__ev) __ev('바인더/QR로 옴',1);
if(QS.has('who')||INST) history.replaceState(null,'',location.pathname+(APP?'?app=1':''));
openCards();

// 새 카드: 지난번에 연 때와 비교(이 폰에서, 고른 닉네임 기준)
function mine(){ const w=sget('chaekmisa-who'); if(!w) return null;
  const ks=(window.MEMBERS[w]||[]).map(k=>'b'+k), ts=(window.TOKENS||[]).filter(t=>t.who===w).map(t=>'t'+t.date+t.kind+t.name);
  return {w,ids:ks.concat(ts)}; }
function check(){ const m=mine(); if(!m) return; const key='chaekmisa-binder-seen:'+m.w, old=sget(key);
  sset(key,JSON.stringify(m.ids)); if(old==null) return;
  let prev; try{ prev=new Set(JSON.parse(old)); }catch(e){ return; }
  const n=m.ids.filter(x=>!prev.has(x)).length; if(!n) return;
  const d=document.createElement('div'); d.id='bnew'; d.textContent=`✦ 새 카드 ${n}장이 들어왔어요`; document.body.appendChild(d); setTimeout(()=>d.remove(),4500);
  if(window.__ev) __ev('바인더/새 카드 봄',1); }
check();
// 닉네임을 처음 고르면 그때부터 셈
document.addEventListener('click',e=>{ if(e.target.closest&&e.target.closest('#cx .who [data-n]')) setTimeout(check,50); },true);

// 홈 화면에 두기
const bar=document.getElementById('binst'), sp=bar.querySelector('.sp'), go=document.getElementById('binstGo');
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let DEF=null;
const show=html=>{ if(APP||(!INST&&sget('chaekmisa-binder-inst'))) return; sp.innerHTML=html; bar.hidden=false; };
document.getElementById('binstX').onclick=()=>{ bar.hidden=true; sset('chaekmisa-binder-inst','x'); };
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); DEF=e; go.hidden=false; show('<b>책미사 바인더</b>를 홈 화면에 두면 앱처럼 바로 열려요.'); });
go.onclick=async()=>{ if(!DEF) return; DEF.prompt(); const r=await DEF.userChoice.catch(()=>null); DEF=null; bar.hidden=true; if(r&&r.outcome==='accepted'&&window.__ev) __ev('바인더/홈 화면에 둠',1); };
addEventListener('appinstalled',()=>{ bar.hidden=true; if(window.__ev) __ev('바인더/홈 화면에 둠',1); });
if(IOS) setTimeout(()=>show('<b>홈 화면에 두기</b> · 사파리 <b>공유</b>(네모 위 화살표) → <b>홈 화면에 추가</b>'),2500);
else setTimeout(()=>{ if(!DEF) show('<b>홈 화면에 두기</b> · 브라우저 메뉴 <b>⋮</b> → <b>홈 화면에 추가</b>'); },4000);

if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
