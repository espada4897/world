<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#05070d"><style>html,body{margin:0;height:100%;background:#04060c}</style></head><body><title>자라는 비행체</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 한 화면: 우주 전체가 캔버스, 위엔 비행체 이름·정거장, 아래엔 조종대, 오른쪽엔 부품 장부 */
:root{
  --void:#05070d; --ink:#e9eefb; --dim:#8a96b3; --gold:#ffd36a; --line:rgba(160,185,230,.22);
  --panel:rgba(8,12,22,.72);
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{text-shadow:0 1px 10px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9);position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:4px;pointer-events:none}
.stage{font-family:var(--display);font-size:clamp(22px,4vw,34px);font-weight:700;letter-spacing:.02em;text-wrap:balance}
.stage small{font-size:.5em;font-weight:400;color:var(--dim);margin-left:.5em;letter-spacing:.08em}
.now{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.now b{color:var(--ink);font-weight:400}
.ledger{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 92px);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;
  display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;backdrop-filter:blur(4px)}
.ledger .h{grid-column:1/-1;font-size:11px;letter-spacing:.12em;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%}
.ledger .n{font-variant-numeric:tabular-nums;text-align:right;min-width:2ch}
.ledger .m{color:var(--dim)}
.ledger .g{grid-column:1/-1;border-top:1px solid var(--line);padding-top:6px;margin-top:2px;color:var(--gold);font-size:12px}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  font-family:var(--display);opacity:0;transition:opacity .5s}
.toast.on{opacity:1}
.toast .a{font-size:15px;color:var(--dim)}
.toast .b{font-size:clamp(18px,3vw,24px)}
.ctrl{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:8px 16px;cursor:pointer}
button:hover{border-color:rgba(255,211,106,.6)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.main{border-color:rgba(255,211,106,.7);color:var(--gold)}
input[type=range]{flex:1 1 220px;max-width:520px;accent-color:var(--gold)}
.size{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:9ch;text-align:center}
.label{position:fixed;left:0;top:0;pointer-events:none;font-size:12px;color:var(--gold);white-space:nowrap;margin:-26px 0 0 10px;text-shadow:0 0 6px #000}
@media (max-width:640px){
  .ledger{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);right:auto;left:max(16px,env(safe-area-inset-left,0px));
    grid-template-columns:auto auto auto auto auto auto;font-size:12px;padding:8px 10px}
  .ledger .m{display:none}
}
</style>

<canvas id="sky"></canvas>
<div class="top">
  <div class="stage" id="stage">아크<small>책미사 · 이름 없는 비행체</small></div>
  <div class="now" id="now"></div>
</div>
<div class="ledger" id="ledger"></div>
<div class="toast" id="toast"><div class="a" id="ta"></div><div class="b" id="tb"></div></div>
<div class="ctrl">
  <button class="main" id="play">▶ 첫 정거장부터 날기</button>
  <input type="range" id="seek" min="0" max="170" value="170" aria-label="정거장">
  <span class="size" id="size"></span>
  <button id="speed">속도 1×</button>
  <button id="view">멀리 보기</button>
  <button id="today">지금 모습</button>
</div>

  let h='<div class="h">지나온 별</div>';
  for(const k in KIND) h+='<span class="dot" style="background:'+KIND[k]+'"></span><span class="m">'+k+'</span><span class="n">'+(cnt[k]||0)+'</span>';
  let gold=0; for(let i=0;i<n;i++) if(R[i][5]==='O') gold++;
  const next=STAGES[st+1];
  h+='<div class="g">금빛 고리 별 '+gold+' · 후기를 쓴 모임</div>';
  h+='<div class="h">'+(next ? '다음 모습 '+next[1]+'까지 '+(next[0]-n)+'정거장' : '마지막 모습 · 다음 그림을 기다리는 중')+'</div>';
  $('ledger').innerHTML=h;
  $('size').textContent=(st+1)+' / 6 단계';
}
seek.addEventListener('input',()=>{ playing=false; playBtn.textContent='▶ 여기서부터 날기'; rest(+seek.value); });
playBtn.addEventListener('click',()=>{
  if(playing){ playing=false; playBtn.textContent='▶ 이어서 날기'; return; }
  if(u>=R.length) rest(0);
  playing=true; playBtn.textContent='⏸ 멈추기';
});
$('speed').addEventListener('click',e=>{ speed= speed===1?3:speed===3?8:1; e.target.textContent='속도 '+speed+'×'; });
$('today').addEventListener('click',()=>{ playing=false; playBtn.textContent='▶ 첫 정거장부터 날기'; rest(R.length); });
$('view').hidden=true;
function nextUp(){ return UPCOMING.find(r=>r[0]>=TODAY); }
function step(dt){
  if(!playing) return;
  const ii=Math.floor(u)-1, pi=ii>=0?planetOf(ii):null, slow=pi&&pi.dive&&u-ii>=1&&u-ii<1.35?(pi.vid?.35*T/(vDur(pi.vid)+(pi.vid.low?3.5:.6)):ready(pi)?.3:1):1;   // 영상: 내려감 영상 길이 + 낮게 3.5초   // 지면 가까이 나는 별에선 천천히
  u=Math.min(R.length, u+dt*speed/T*slow);
  const k=Math.floor(u+1e-9);
  if(k>n){ const grew=stageIx(k)!==st; setN(k,true); const r=R[k-1]; if(speed<8&&!grew) toast(k+'번째 별 · '+r[0].replaceAll('-','.')+' · '+r[1], '『'+r[2]+'』', Math.min(2.2,T/speed*.8)); }
  if(u>=R.length){ playing=false; playBtn.textContent='▶ 첫 정거장부터 날기'; const x=nextUp();
    setTimeout(()=>toast('지금, '+R.length+'번째 별', x?'다음 별 · '+x[0].slice(5).replace('-','.')+' 『'+x[2]+'』':'책미사의 비행체는 아직 자라는 중',3),900); }
}

// ---- 비행체의 움직임: 늘 화면에 있음 ----
// 순항(옆모습) 사이사이 다음 별 쪽으로 몸을 틀어 파고들었다가(뒷모습) 돌아옴, 또는 크게 기울며 돎. 모습이 자라면 앞모습으로 돌아 보여 줌
const VIEWS = {"0": {"rear": {"w": 329, "h": 188, "eng": [0.25637827844452105, 0.4997696863347225]}, "front": {"w": 326, "h": 210, "eng": [0.16624001412367037, 0.4903048989379925]}}, "3": {"rear": {"w": 526, "h": 396, "eng": [0.16470986732566517, 0.4840785521463062]}, "front": {"w": 606, "h": 371, "eng": [0.11058142851322168, 0.4238294898672257]}}, "4": {"rear": {"w": 576, "h": 438, "eng": [0.17637105367721428, 0.5125659844071943]}, "front": {"w": 593, "h": 451, "eng": [0.07824124590814403, 0.5272107734446329]}}, "5": {"rear": {"w": 711, "h": 536, "eng": [0.12567963744335053, 0.5676268656716418]}, "front": {"w": 711, "h": 558, "eng": [0.16317362499074692, 0.4621474721750613]}}}; const VIMG={}; for(const k in VIEWS){ VIMG[k]={}; for(const v in VIEWS[k]) VIMG[k][v]=Object.assign(new Image(),{src:'ship/s'+(+k+1)+'_'+v+'.png'}); }
const bump=(t,a,b)=>{ const q=(t-a)/(b-a); return q<=0||q>=1?0:Math.sin(Math.PI*q); };
function shipPose(){
  let x=.40, y=.47, s=1, r=-.07, view=null, vm=0;
  if(playing||posePlay){
    const i=Math.max(0,Math.min(R.length-1,Math.floor(u))), tl=u-Math.floor(u), h=R.length?hash(R[i][2]+'s'):0;
    const pin=planetOf(i), pout=i>0?planetOf(i-1):null;
    if(pin.dive&&tl>.45){ const q=ease(Math.min(1,(tl-.45)/.45)); view='rear'; vm=Math.max(0,Math.min(1,(q-.2)/.3)); x+=.12*q; y+=.03*q; s*=1-.2*q; r-=.04*q; }
    else if(pout&&pout.dive&&tl<.85){
      // 영상이 있는 별: 카메라가 화면 안쪽으로 날아가므로 비행체도 내내 뒷모습(따라가는 시점), 살짝 좌우로 기울며 / 나올 때 옆모습으로 풀리며 솟음
      // 영상이 없는 별: 그림이 옆으로 흐르므로 뒷모습에서 옆모습으로 풀리며 낮게
      const hv=pout.vid&&(pout.vid.down||pout.vid.low);
      const q=hv ? (tl<.33?1:1-ease(Math.min(1,(tl-.33)/.15))) : (tl<.3?1-ease(tl/.3):0), up=bump(tl,hv?.36:.3,.85);
      const lf=ready(pout)?lowF(tl/.35):0, sway=hv&&tl<.35?Math.sin(clock*.9)*.05*Math.min(1,tl/.03):0;
      view='rear'; vm=Math.max(0,Math.min(1,(q-.2)/.3)); x+=.12*q+sway*.25; y+=.03*q+.05*bump(tl,0,.5)*(1-lf)+.09*lf-.07*up; s*=(1-.2*q)*(1+.06*lf); r-=.04*q+.17*up-sway; }
    else if(h<.5){ const q=bump(tl,.15,.95); view='rear'; vm=Math.max(0,Math.min(1,(q-.35)/.2)); x+=.11*q; y-=.08*q; s*=1-.25*q; r-=.08*q; }
    else if(h<.8){ const q=bump(tl,.1,.9); r-=.16*q; y+=.05*q; x-=.04*q; s*=1+.08*q; }
    else { const q=bump(tl,.2,.9); y-=.06*q; x+=.05*q; r+=.06*Math.sin(tl*Math.PI*2)*q; }
  }
  if(pop<1){ const q=Math.sin(Math.PI*pop); view='front'; vm=Math.max(0,Math.min(1,(q-.25)/.2)); s*=1+.25*q; x-=.04*q; }
  const dx=Math.sin(clock*.21)*.03, dy=Math.sin(clock*.33+1)*.025, dr=Math.sin(clock*.27)*.03;
  if(!view||!VIEWS[st]||!VIEWS[st][view]){ view=null; vm=0; }
  return {x:(x+dx)*W, y:(y+dy)*Hs, s, r:r+dr, flip:false, a:1, sx:1, view, vm};
}
function drawShipAt(q,W0,H0,alpha,BL){
  if(q.a<=0||!shipCv.width) return; const w=W0*q.s, h=H0*q.s, E=SHIP[st].eng; let g;
  ctx.save(); ctx.globalAlpha=alpha*q.a; ctx.translate(q.x,q.y); ctx.rotate(q.r); ctx.scale((q.flip?-1:1)*q.sx,1);
  if(BL>0&&!(q.view&&q.vm>.5)){
    // 엔진 불꽃: 납작한 빛줄기 대신, 흐리게 번지는 두 겹(바깥 푸른 기운 + 안쪽 흰 심지)
    const ex=(E[0]-.5)*w, ey=(E[1]-.5)*h, beams=1+Math.min(2,st>>1), sp=h*SHIP[st].espan*.5, L=Math.min(BL*.55, w*1.1)*Math.max(.3,q.s);
    const blur='filter' in ctx;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let j=0;j<beams;j++){ const yy=ey+(beams>1?(j/(beams-1)-.5)*sp*1.4:0), th=Math.max(1.5,h*.045), fl=.9+.1*Math.sin(clock*23+j*2);
      for(const [len,rad,a0,b] of [[L*fl,th*1.5,.32,th*.9],[L*.45*fl,th*.65,.75,th*.35]]){
        if(blur) ctx.filter='blur('+Math.max(1,b).toFixed(1)+'px)';
        g=ctx.createLinearGradient(ex,0,ex-len,0); g.addColorStop(0,'rgba(225,250,255,'+a0+')'); g.addColorStop(.25,'rgba(110,210,255,'+(a0*.6)+')'); g.addColorStop(1,'rgba(60,150,255,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(ex,yy-rad); ctx.quadraticCurveTo(ex-len*.35,yy-rad*.9,ex-len,yy); ctx.quadraticCurveTo(ex-len*.35,yy+rad*.9,ex,yy+rad); ctx.closePath(); ctx.fill(); } }
    ctx.restore(); }
  const VI=q.view&&VIMG[st]?VIMG[st][q.view]:null, vm=VI&&VI.complete&&VI.naturalWidth?q.vm:0;
  if(vm<1){ ctx.globalAlpha=alpha*q.a*(1-vm); ctx.drawImage(shipCv,-w/2,-h/2,w,h); }
  if(vm>0){ const V=VIEWS[st][q.view], vw=w*V.w/SHIP[st].w*1.1, vh=vw*V.h/V.w;
    ctx.globalAlpha=alpha*q.a*vm; ctx.drawImage(VI,-vw/2,-vh/2,vw,vh);
    if(q.view==='rear'){ const gx=(V.eng[0]-.5)*vw, gy=(V.eng[1]-.5)*vh, gr=vh*.13*(.92+.08*Math.sin(clock*19)); ctx.globalCompositeOperation='lighter';
      const gg=ctx.createRadialGradient(gx,gy,0,gx,gy,gr); gg.addColorStop(0,'rgba(220,250,255,.35)'); gg.addColorStop(.4,'rgba(90,210,255,.14)'); gg.addColorStop(1,'rgba(60,160,255,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(gx,gy,gr,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over'; } }
  ctx.restore();
}

function stopVid(){ const p=PL[inside.i]; if(p&&p.vid) for(const x of [p.vid.down,p.vid.low]) if(x) x.pause(); inside=null; }
let prev=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000); prev=now; clock+=dt;
  if(toastTimer>0){ toastTimer-=dt; if(toastTimer<=0){ toastTimer=0; toastEl.classList.remove('on'); } }
  step(dt);
  { const ii=Math.floor(u)-1, pi=ii>=0&&ii<R.length?planetOf(ii):null, inV=pi&&pi.vid&&u-ii>=1&&u-ii<1.35;
    if(inV){ const V=pi.vid; if(!inside||inside.i!==ii){ if(inside) stopVid(); inside={i:ii,el:0}; if(V.low) V.low.currentTime=0; if(V.down){ V.down.currentTime=0; V.down.play().catch(()=>{}); } else if(V.low){ V.low.play().catch(()=>{}); } }
      else if(playing||posePlay) inside.el+=dt*speed;
      const rt=Math.min(4,speed); for(const x of [V.down,V.low]) if(x) x.playbackRate=rt;
      if(V.low&&V.down&&inside.el>=vDur(V)-.85&&V.low.paused&&V.low.currentTime<.05){ V.low.currentTime=0; V.low.play().catch(()=>{}); }
      if(!playing&&!posePlay) for(const x of [V.down,V.low]) if(x&&!x.paused) x.pause(); }
    else if(inside) stopVid(); }
  const go=playing?Math.min(speed,3):0, v=VP();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#04060c'; ctx.fillRect(0,0,W,Hs);
  // 해마다 다른 우주 배경: 다가가는 별의 해로 천천히 바뀜
  const iy=Math.max(0,Math.min(R.length-1,Math.floor(u))), yr=R.length?+R[iy][0].slice(0,4):2020;
  if(yr!==bgYear){ bgPrev=bgYear; bgYear=yr; bgFade=0; }
  bgFade=Math.min(1,bgFade+dt/3);
  const bz=1.05+Math.sin(clock*.02)*.01;
  if(bgFade<1) drawBg(bgPrev,1,bz); drawBg(bgYear,bgFade,bz); ctx.fillStyle='rgba(4,6,12,.18)'; ctx.fillRect(0,0,W,Hs);
  // 별빛: 소실점에서 끝없이 흘러나옴(날 때는 빛줄기)
  const vs=playing?.16*go+.02:.012, m=Math.min(W,Hs*1.6)*.5;
  for(const o of STARS){ const z0=o.z; o.z-=dt*vs;
    const X=v.x+o.x*m/o.z, Y=v.y+o.y*m/o.z;
    if(o.z<.04||X<-20||X>W+20||Y<-20||Y>Hs+20){ Object.assign(o,newStar(1)); continue; }
    const zb=Math.min(1.2,z0+dt*vs*5), X0=v.x+o.x*m/zb, Y0=v.y+o.y*m/zb, br=Math.min(1,(1-o.z)*1.3)*(.4+.6*o.b);
    ctx.strokeStyle='rgba(225,232,255,'+br+')'; ctx.lineWidth=.6+(1-o.z)*1.6; ctx.beginPath(); ctx.moveTo(X0,Y0); ctx.lineTo(X+.5,Y+.5); ctx.stroke(); }
  // 별(행성): 먼 것부터
  const list=[], fu=Math.floor(u);
  for(let i=fu-2;i<=fu+1;i++){ if(i<0||i>=R.length) continue; const t=u-i, p=planetOf(i); if(t<-.8||t>(p.dive?1.85:1.4)) continue;
    const G=geom(p,t), key=p.dive&&t>=1.35?-1:p.dive&&t>=1?1e9:G.r; list.push([p,t,G,key]); }
  if(fu+2<R.length) planetOf(fu+2);
  list.sort((a,b)=>a[3]-b[3]);
  // 11/26 이음새: 영상 별에서 나오는 동안 땅이 아직 화면을 덮고 있으면 다음 별은 숨겼다가, 땅이 빠지는 만큼 드러냄
  let cov=0; for(const [p,t] of list) if(p.dive&&p.vid&&t>=1&&t<1.85) cov=Math.max(cov, t<1.35?1:1-sm(t,1.4,1.75));
  let hz=0; for(const [p,t,G] of list) hz=Math.max(hz, drawPlanetAt(p,G,Math.max(0,Math.min(1,(t+.8)/.35))*(p.dive&&t>=1?1:1-cov),t));
  // 다가오는 별 이름
  ctx.font='15px "Gowun Batang",serif'; ctx.textAlign='center';
  { let best=null, ba=0; for(const [p,t,G] of list){ if(t>=1) continue; const a=Math.min(1,(t+.6)*3)*Math.max(0,Math.min(1,(Hs*.24-G.r)/(Hs*.08))); if(a>0&&(!best||G.r>best[2].r)){ best=[p,t,G]; ba=a; } }
    ba*=Math.max(0,1-hz*1.4);   // 행성 안을 날 때는 이름을 감춤, 이름은 가장 가까이 오는 별 하나만
    if(best&&ba>0){ const [p,,G]=best; ctx.fillStyle='rgba(233,238,251,'+(ba*.9)+')'; ctx.fillText('『'+R[p.i][2]+'』',G.cx,G.cy-G.r*1.2-10); } }
  // 먼 소행성
  rockA=Math.max(0,1-hz*1.3); const fs=playing?.3*go:.04;
  for(const o of ROCKS){ o.x-=dt*fs*.6*o.z; o.y+=dt*fs*.08*o.z; o.rot+=dt*o.vr; if(o.x<-.1||o.y>1.1){ Object.assign(o,newRock(1.08)); } }
  ROCKS.filter(o=>o.z<=1.5).forEach(drawRock);
  // 비행체
  pop=Math.min(1,pop+dt/2.2); const pe=1-Math.pow(1-Math.min(1,pop*1.6),3);
  const b=shipBox(st), span=(STAGES[st+1]?STAGES[st+1][0]:R.length)-STAGES[st][0], grow=1+.05*((n-STAGES[st][0])/Math.max(1,span));
  const W0=b.w*grow*(.7+.3*pe), H0=b.h*grow*(.7+.3*pe);
  const pose=shipPose();
  drawShipAt(pose,W0,H0,1,W*(.12+(playing?.18*go/3+.08:0))*(.92+.08*Math.sin(clock*17)));
  // 자랄 때: 화면 전체 번쩍임 대신 비행체 둘레로 번지는 빛
  if(glow>0){ glow=Math.max(0,glow-dt*.5); const R0=W0*.9, g=ctx.createRadialGradient(pose.x,pose.y,0,pose.x,pose.y,R0);
    g.addColorStop(0,'rgba(255,240,210,'+(glow*.55)+')'); g.addColorStop(1,'rgba(255,220,160,0)'); ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g; ctx.fillRect(pose.x-R0,pose.y-R0,R0*2,R0*2); ctx.restore(); }
  // 가까운 소행성(비행체 앞을 스침)
  ctx.save(); if('filter' in ctx) ctx.filter='blur(3px)'; ROCKS.filter(o=>o.z>1.5).forEach(drawRock); ctx.restore();
  requestAnimationFrame(frame);
}
render(); { const mm=location.hash.match(/^#look-([\d.]+)(-p)?$/); if(mm){ u=+mm[1]; setN(Math.min(R.length,Math.floor(u)),false); posePlay=!!mm[2]; } } requestAnimationFrame(frame);
})();
